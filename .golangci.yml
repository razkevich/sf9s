version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive
    - nilerr
    - errorlint
    - copyloopvar
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        # Writing usage text to a stream we do not own; a failure there is
        # already the caller's problem and there is nowhere to report it.
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: e2e/
        linters: [errcheck]

formatters:
  enable:
    - gofmt
